name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expenses_test
          POSTGRES_DB: expenses_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenses_test -d expenses_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://expenses_test:test-only-password@127.0.0.1:5432/expenses_test?sslmode=disable
      TEST_REQUIRE_DATABASE: "1"
      CGO_ENABLED: "1"
      RUN_LIVE_LLM: "0"
      TELEGRAM_BOT_TOKEN: ""
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal web/embed.go)"
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL integration tests with the race detector
        run: go test -race -count=1 -timeout=5m -v ./...
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check dashboard JavaScript
        run: node --check web/app.js
      - name: Dashboard tests
        run: node --test web/app.test.js
      - name: Check localization exceptions
        run: python3 scripts/check_cyrillic.py
